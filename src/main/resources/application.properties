spring.application.name=budgeting

# Database Configuration (H2 in-memory por padrao para execucao imediata; compativel com MySQL via compose.yml)
spring.datasource.url=${DB_URL:jdbc:h2:mem:budgetingdb;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring AI - OpenAI Configuration (Chat, Whisper Speech-to-Text, TTS Text-to-Speech)
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-demo-placeholder-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# Audio Transcription (Whisper-1)
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro. Contém descrição de gastos e consultas financeiras em reais.

# Audio Speech (TTS)
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=nova
spring.ai.openai.audio.speech.options.speed=1.15
spring.ai.openai.audio.speech.options.response-format=mp3

logging.level.org.springframework.ai=DEBUG
